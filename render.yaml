# Render blueprint for the processing server (free plan).
# In Render: New → Blueprint → pick this repository. Then set ALLOWED_ORIGINS to your website's address.
services:
  - type: web
    name: thefilekit-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://thefilekit.vercel.app
      # The free plan has 512 MB of memory: keep jobs small and one at a time.
      - key: MAX_UPLOAD_MB
        value: "150"
      - key: MAX_PARALLEL
        value: "1"
      - key: KEEP_HOURS
        value: "1"
      - key: FILEKIT_DATA_DIR
        value: /tmp/filekit
