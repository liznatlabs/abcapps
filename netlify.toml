# Netlify settings for the website (an alternative to Vercel). Set SITE_URL and API_URL in
# Site configuration → Environment variables.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
