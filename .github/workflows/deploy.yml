# Deploys the website to Vercel on every push to main, after checking that it builds.
#
# One-time setup — add these under GitHub → Settings → Secrets and variables → Actions:
#   Secrets:    VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   Variables:  SITE_URL (e.g. https://thefilekit.com), API_URL (address of the processing server)
#
# If you connect the repository in the Vercel dashboard instead, Vercel deploys on push by itself;
# in that case delete this file so the site is not deployed twice.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the scripts parse
        run: for f in server/*.js shared/*.js public/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Build the site
        run: node scripts/build.mjs
      - name: Deploy to Vercel
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
