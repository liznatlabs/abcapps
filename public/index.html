<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The File Kit by Liznat Labs — video, audio, PDF and converter tools</title>
  <meta name="description" content="The File Kit by Liznat Labs: 51 tools to edit video and audio, work with PDFs and convert files. No sign-up.">
  <meta property="og:title" content="The File Kit by Liznat Labs">
  <meta property="og:description" content="51 tools for video, audio, PDF and file conversion, in one place.">
  <meta name="theme-color" content="#090a0d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply the saved appearance before first paint (auto follows the system).
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('abc-theme') || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="/" data-link aria-label="The File Kit by Liznat Labs — home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-text"><b>The File Kit</b><small>by Liznat Labs</small></span>
      </a>
      <nav class="menu" id="menu" aria-label="Tools"></nav>
      <div class="search" role="search">
        <input id="search" type="search" placeholder="Search tools" autocomplete="off" aria-label="Search tools" aria-controls="search-results">
        <kbd aria-hidden="true">/</kbd>
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1"></main>

  <footer class="foot">
    <div class="wrap">
      <div class="foot-row">
        <div>
          <a class="brand" href="/" data-link aria-label="The File Kit — home">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="brand-text"><b>The File Kit</b><small>by Liznat Labs</small></span>
          </a>
          <p id="foot-note">Your files are processed on this server and deleted automatically.</p>
        </div>
        <div>
          <h2>Collections</h2>
          <nav id="foot-nav" aria-label="Collections"></nav>
        </div>
        <div>
          <h2>Appearance</h2>
          <div class="theme" id="theme" role="group" aria-label="Appearance">
            <button type="button" data-theme-set="auto">Auto</button><button type="button" data-theme-set="light">Light</button><button type="button" data-theme-set="dark">Dark</button>
          </div>
        </div>
      </div>
      <div class="foot-base"><span>© <span id="year"></span> Liznat Labs</span><span>No sign-up. No watermarks.</span></div>
    </div>
  </footer>

  <noscript><p style="padding:2rem;text-align:center">The File Kit needs JavaScript to run.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
